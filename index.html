<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
<meta charset="UTF-8">
<title>شجرة العائلة</title>

<style>

body{
    background:#0d1117;
    color:white;
    font-family:tahoma;
    text-align:center;
}

.tree ul{
    padding-top:20px;
    position:relative;
}

.tree li{
    display:inline-block;
    vertical-align:top;
    text-align:center;
    list-style:none;
    position:relative;
    padding:20px 5px 0 5px;
}

.tree li::before,
.tree li::after{
    content:'';
    position:absolute;
    top:0;
    width:50%;
    height:20px;
    border-top:2px solid #666;
}

.tree li::before{
    right:50%;
}

.tree li::after{
    left:50%;
}

.tree li:only-child::before,
.tree li:only-child::after{
    display:none;
}

.tree ul ul::before{
    content:'';
    position:absolute;
    top:0;
    left:50%;
    height:20px;
    border-left:2px solid #666;
}

.person{
    background:#161b22;
    border:1px solid #30363d;
    border-radius:10px;
    padding:15px;
    min-width:120px;
    display:inline-block;
}

</style>

</head>

<body>

<h1>🌳 شجرة العائلة</h1>

<div class="tree">

<ul>

<li>

<div class="person">
علي
</div>

<ul>

<li>

<div class="person">
عيسى
</div>

<ul>

<li>
<div class="person">
محمد
</div>
</li>

<li>
<div class="person">
عبدالله
</div>
</li>

</ul>

</li>

<li>

<div class="person">
أحمد
</div>

</li>

</ul>

</li>

</ul>

</div>

</body>

</html>

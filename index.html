<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>شجرة العائلة</title>

<style>

body{
    margin:0;
    background:#0d1117;
    color:white;
    font-family:tahoma;
}

header{
    background:#161b22;
    padding:20px;
    text-align:center;
}

.container{
    max-width:1200px;
    margin:auto;
    padding:20px;
}

.card{
    background:#161b22;
    padding:20px;
    margin-bottom:20px;
    border-radius:10px;
}

input, select{
    width:100%;
    padding:10px;
    margin-top:10px;
    margin-bottom:10px;
    background:#21262d;
    color:white;
    border:none;
    border-radius:8px;
}

button{
    background:#238636;
    color:white;
    border:none;
    padding:10px 20px;
    border-radius:8px;
    cursor:pointer;
}

.person{
    background:#21262d;
    padding:15px;
    border-radius:8px;
    margin-top:10px;
}

.small{
    color:#8b949e;
    font-size:14px;
}

</style>
</head>

<body>

<header>
<h1>🌳 شجرة العائلة</h1>
</header>

<div class="container">

<div class="card">

<h2>إضافة شخص</h2>

<input id="name" placeholder="اسم الشخص">

<select id="father">
<option value="">بدون أب (مؤسس العائلة)</option>
</select>

<button onclick="addPerson()">
إضافة
</button>

</div>

<div class="card">

<h2>الأشخاص</h2>

<div id="list"></div>

</div>

</div>

<script>

let people =
JSON.parse(localStorage.getItem("family")) || [];

function save(){
localStorage.setItem(
"family",
JSON.stringify(people)
);
}

function render(){

let list =
document.getElementById("list");

let father =
document.getElementById("father");

list.innerHTML = "";

father.innerHTML =
'<option value="">بدون أب (مؤسس العائلة)</option>';

people.forEach(p=>{

father.innerHTML +=
`<option value="${p.id}">
${p.name}
</option>`;

});

people.forEach(p=>{

let parent = "";

if(p.fatherId){

let f = people.find(
x=>x.id==p.fatherId
);

if(f){
parent =
`<div class="small">
الأب: ${f.name}
</div>`;
}

}

list.innerHTML +=

`
<div class="person">

<b>${p.name}</b>

${parent}

</div>
`;

});

save();
}

function addPerson(){

let name =
document.getElementById("name").value;

if(name==="") return;

let fatherId =
document.getElementById("father").value;

people.push({

id: Date.now(),

name:name,

fatherId: fatherId || null

});

document.getElementById("name").value="";

render();

}

render();

</script>

</body>
</html>

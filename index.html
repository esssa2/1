<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>شجرة العائلة</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
}

body{
font-family:tahoma;
background:#0d1117;
color:white;
}

header{
background:#161b22;
padding:20px;
text-align:center;
border-bottom:1px solid #30363d;
}

.container{
max-width:1400px;
margin:auto;
padding:20px;
}

.card{
background:#161b22;
padding:20px;
border-radius:12px;
margin-bottom:20px;
border:1px solid #30363d;
}

input,select{
width:100%;
padding:12px;
background:#21262d;
border:none;
border-radius:8px;
color:white;
margin-top:10px;
margin-bottom:10px;
}

button{
background:#238636;
color:white;
border:none;
padding:12px 20px;
border-radius:8px;
cursor:pointer;
}

button:hover{
background:#2ea043;
}

.person{
display:inline-block;
padding:12px 18px;
background:#21262d;
border:1px solid #3d444d;
border-radius:10px;
min-width:140px;
margin:5px;
}

.tree{
overflow:auto;
padding:20px;
}

.tree ul{
padding-top:20px;
position:relative;
padding-right:0;
display:flex;
justify-content:center;
}

.tree li{
list-style:none;
text-align:center;
position:relative;
padding:20px 10px 0 10px;
}

.tree li::before,
.tree li::after{
content:'';
position:absolute;
top:0;
right:50%;
border-top:2px solid #555;
width:50%;
height:20px;
}

.tree li::after{
right:auto;
left:50%;
border-right:2px solid #555;
}

.tree li:only-child::before,
.tree li:only-child::after{
display:none;
}

.tree li:only-child{
padding-top:0;
}

.tree li:first-child::before{
border:none;
}

.tree li:last-child::after{
border:none;
}

.tree li:last-child::before{
border-left:2px solid #555;
}

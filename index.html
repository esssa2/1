<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>شجرة العائلة</title>

<style>

body{
    background:#0d1117;
    color:white;
    font-family:Tahoma;
    margin:0;
}

header{
    background:#161b22;
    padding:20px;
    text-align:center;
    border-bottom:1px solid #30363d;
}

.container{
    max-width:1000px;
    margin:auto;
    padding:20px;
}

.card{
    background:#161b22;
    padding:20px;
    border-radius:12px;
    margin-top:20px;
    border:1px solid #30363d;
}

input{
    width:100%;
    padding:12px;
    border:none;
    border-radius:8px;
    background:#21262d;
    color:white;
}

.person{
    background:#21262d;
    padding:15px;
    margin-top:10px;
    border-radius:8px;
}

</style>

</head>

<body>

<header>
<h1>🌳 شجرة العائلة</h1>
</header>

<div class="container">

<div class="card">

<h2>البحث</h2>

<input type="text" placeholder="ابحث عن شخص">

</div>

<div class="card">

<h2>العائلة</h2>

<div class="person">
👴 عبدالله الصيبعي
</div>

<div class="person">
👨 عيسى بن عبدالله الصيبعي
</div>

<div class="person">
👦 عيسى علي الصيبعي
</div>

</div>

</div>

</body>

</html>

<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>شجرة العائلة</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
}

body{
font-family:tahoma;
background:#0d1117;
color:white;
}

header{
background:#161b22;
padding:20px;
text-align:center;
border-bottom:1px solid #30363d;
}

.container{
max-width:1400px;
margin:auto;
padding:20px;
}

.card{
background:#161b22;
padding:20px;
border-radius:12px;
margin-bottom:20px;
border:1px solid #30363d;
}

input,select{
width:100%;
padding:12px;
background:#21262d;
border:none;
border-radius:8px;
color:white;
margin-top:10px;
margin-bottom:10px;
}

button{
background:#238636;
color:white;
border:none;
padding:12px 20px;
border-radius:8px;
cursor:pointer;
}

button:hover{
background:#2ea043;
}

.person{
display:inline-block;
padding:12px 18px;
background:#21262d;
border:1px solid #3d444d;
border-radius:10px;
min-width:140px;
margin:5px;
}

.tree{
overflow:auto;
padding:20px;
}

.tree ul{
padding-top:20px;
position:relative;
padding-right:0;
display:flex;
justify-content:center;
}

.tree li{
list-style:none;
text-align:center;
position:relative;
padding:20px 10px 0 10px;
}

.tree li::before,
.tree li::after{
content:'';
position:absolute;
top:0;
right:50%;
border-top:2px solid #555;
width:50%;
height:20px;
}

.tree li::after{
right:auto;
left:50%;
border-right:2px solid #555;
}

.tree li:only-child::before,
.tree li:only-child::after{
display:none;
}

.tree li:only-child{
padding-top:0;
}

.tree li:first-child::before{
border:none;
}

.tree li:last-child::after{
border:none;
}

.tree li:last-child::before{
border-left:2px solid #555;
}

.tree ul ul::before{
content:'';
position:absolute;
top:0;
right:50%;
border-right:2px solid #555;
height:20px;
}

.stats{
display:flex;
gap:15px;
flex-wrap:wrap;
}

.stat{
background:#21262d;
padding:15px;
border-radius:10px;
flex:1;
min-width:200px;
text-align:center;
}

</style>
</head>

<body>

<header>
<h1>🌳 شجرة العائلة</h1>
</header>

<div class="container">

<div class="card">

<h2>إضافة شخص</h2>

<input id="name" placeholder="اسم الشخص">

<select id="father">
<option value="">
بدون أب (الجد الأعلى)
</option>
</select>

<button onclick="addPerson()">
إضافة
</button>

</div>

<div class="card">

<h2>البحث</h2>

<input
id="search"
placeholder="ابحث عن شخص"
onkeyup="render()">

</div>

<div class="card">

<div class="stats">

<div class="stat">
عدد الأفراد
<h2 id="count">0</h2>
</div>

</div>

</div>

<div class="card">

<h2>الشجرة</h2>

<div id="tree"></div>

</div>

</div>

<script>

let people =
JSON.parse(localStorage.getItem("familyTree")) || [

{
id:1,
name:"علي",
father:null
},

{
id:2,
name:"عيسى",
father:1
},

{
id:3,
name:"محمد",
father:2
},

{
id:4,
name:"عبدالله",
father:2
}

];

function save(){

localStorage.setItem(
"familyTree",
JSON.stringify(people)
);

}

function addPerson(){

let name =
document.getElementById("name").value.trim();

let father =
document.getElementById("father").value;

if(!name){
alert("أدخل اسم الشخص");
return;
}

people.push({

id:Date.now(),

name:name,

father: father || null

});

document.getElementById("name").value="";

save();

render();

}

function buildTree(parentId){

let children =
people.filter(
x => String(x.father) === String(parentId)
);

if(children.length===0)
return "";

let html = "<ul>";

children.forEach(child=>{

html += `
<li>

<div class="person">
${child.name}
</div>

${buildTree(child.id)}

</li>
`;

});

html += "</ul>";

return html;

}

function render(){

document.getElementById("count")
.innerText = people.length;

let fatherSelect =
document.getElementById("father");

fatherSelect.innerHTML =
'<option value="">بدون أب (الجد الأعلى)</option>';

people.forEach(person=>{

fatherSelect.innerHTML +=

`
<option value="${person.id}">
${person.name}
</option>
`;

});

let search =
document.getElementById("search")
.value
.toLowerCase();

let roots =
people.filter(
p=>!p.father
);

let html =
'<div class="tree"><ul>';

roots.forEach(root=>{

if(
search &&
!root.name.toLowerCase().includes(search)
){

let found =
people.some(
p=>
p.name.toLowerCase()
.includes(search)
);

if(!found) return;
}

html += `

<li>

<div class="person">
${root.name}
</div>

${buildTree(root.id)}

</li>
`;

});

html += "</ul></div>";

document.getElementById("tree")
.innerHTML = html;

save();

}

render();

</script>

</body>
</html>
